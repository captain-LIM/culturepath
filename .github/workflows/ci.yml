name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true
          pub-cache: true
      - name: Clear stale pub.dev credentials
        run: |
          rm -f "$HOME/.config/dart/pub-credentials.json"
          rm -f "$HOME/.pub-cache/credentials.json"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate ephemeral CI upload keystore
        if: ${{ !cancelled() }}
        env:
          CI_KEYSTORE_PASSWORD: culturepath-ci-only
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/ci-upload-keystore.jks \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CulturePath CI, OU=CI, O=CulturePath, C=KR"
          printf '%s\n' \
            'storeFile=ci-upload-keystore.jks' \
            "storePassword=$CI_KEYSTORE_PASSWORD" \
            'keyAlias=ci-upload' \
            "keyPassword=$CI_KEYSTORE_PASSWORD" \
            > android/key.properties
      - name: Build and verify release AAB with ephemeral upload signing
        run: |
          flutter build appbundle --release
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs \
            build/app/outputs/bundle/release/app-release.aab \
            | grep -F 'CN=CulturePath CI'
        if: ${{ !cancelled() }}
