<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="따라가방에서 공유된 문화여행 코스 열기">
  <title>공유 코스 열기 | 따라가방</title>
  <style>
    :root{--ink:#24332a;--muted:#5d6b62;--brand:#315c43;--paper:#fffef9;--line:#dce5dc}*{box-sizing:border-box}body{margin:0;background:#f2f5ef;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}main{width:min(560px,calc(100% - 32px));margin:48px auto;padding:clamp(28px,7vw,52px);text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:22px}h1{margin:.4rem 0 1rem;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.25}p{color:var(--muted)}.mark{font-size:2.4rem}.button{display:block;margin-top:14px;padding:13px 18px;border-radius:11px;background:var(--brand);color:#fff;font-weight:750;text-decoration:none}.secondary{background:#e5ece6;color:var(--ink)}.error{color:#943d31;font-weight:700}:focus-visible{outline:3px solid #9fc6aa;outline-offset:3px}
  </style>
</head>
<body><main>
  <div class="mark" aria-hidden="true">🧳</div>
  <h1 id="title">따라가방 공유 코스</h1>
  <p id="description">앱이 설치되어 있다면 아래 버튼으로 공유된 코스를 확인할 수 있어요.</p>
  <a class="button" id="open-app" href="#">앱에서 코스 열기</a>
  <a class="button secondary" id="store" href="https://play.google.com/store/apps/details?id=com.culturepath.frontend">Google Play에서 따라가방 보기</a>
  <p class="error" id="error" hidden>올바르지 않은 공유 링크입니다.</p>
</main><script>
const copy={ko:{title:'따라가방 공유 코스',description:'앱이 설치되어 있다면 아래 버튼으로 공유된 코스를 확인할 수 있어요.',open:'앱에서 코스 열기',store:'Google Play에서 따라가방 보기',error:'올바르지 않은 공유 링크입니다.'},en:{title:'Shared Tara-gabang course',description:'If the app is installed, use the button below to view the shared course.',open:'Open course in app',store:'View Tara-gabang on Google Play',error:'This share link is invalid.'},ja:{title:'共有されたタラガバンのコース',description:'アプリがインストールされている場合、下のボタンから共有コースを確認できます。',open:'アプリでコースを開く',store:'Google Playでタラガバンを見る',error:'共有リンクが正しくありません。'},zh:{title:'分享的随行包路线',description:'如果已安装应用，请点击下方按钮查看分享的路线。',open:'在应用中打开路线',store:'在Google Play查看随行包',error:'分享链接无效。'}};
const raw=(navigator.language||'ko').toLowerCase(),lang=raw.startsWith('en')?'en':raw.startsWith('ja')?'ja':raw.startsWith('zh')?'zh':'ko',text=copy[lang],id=new URLSearchParams(location.search).get('id'),valid=/^[1-9][0-9]*$/.test(id||'');document.documentElement.lang=lang;document.querySelector('#title').textContent=text.title;document.querySelector('#description').textContent=text.description;document.querySelector('#open-app').textContent=text.open;document.querySelector('#store').textContent=text.store;document.querySelector('#error').textContent=text.error;if(valid){document.querySelector('#open-app').href=`culturepath://app/courses/${id}`}else{document.querySelector('#open-app').hidden=true;document.querySelector('#error').hidden=false}
  </script></body>
</html>
