<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>계정 삭제 확인 | CulturePath</title><style>:root{--ink:#24332a;--muted:#5d6b62;--brand:#8a3d31;--paper:#fffef9;--line:#dce5dc}*{box-sizing:border-box}body{margin:0;background:#f2f5ef;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}main{width:min(640px,calc(100% - 32px));margin:48px auto;padding:clamp(24px,6vw,48px);background:var(--paper);border:1px solid var(--line);border-radius:20px}p{color:var(--muted)}button{padding:12px 18px;border:0;border-radius:10px;background:var(--brand);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}#status{min-height:1.6em;font-weight:700}:focus-visible{outline:3px solid #dba49c;outline-offset:3px}</style></head>
<body><main><p><strong>CulturePath</strong></p><h1 id="title"></h1><p id="body"></p><p><strong id="warning"></strong></p><button id="delete" type="button"></button><p id="status" role="status" aria-live="polite"></p></main><script>
const copy={ko:{title:'계정 삭제 최종 확인',body:'아래 버튼을 누르면 계정과 관련 데이터가 영구 삭제됩니다.',warning:'이 작업은 되돌릴 수 없습니다.',action:'계정 영구 삭제',success:'계정과 관련 데이터가 삭제되었습니다.',invalid:'링크가 유효하지 않거나 만료되었습니다.',error:'현재 삭제할 수 없습니다. 잠시 후 다시 시도해 주세요.'},en:{title:'Final account deletion confirmation',body:'Selecting the button below permanently deletes your account and related data.',warning:'This action cannot be undone.',action:'Permanently delete account',success:'Your account and related data have been deleted.',invalid:'This link is invalid or expired.',error:'Deletion is currently unavailable. Try again later.'},ja:{title:'アカウント削除の最終確認',body:'下のボタンを押すと、アカウントと関連データが完全に削除されます。',warning:'この操作は取り消せません。',action:'アカウントを完全に削除',success:'アカウントと関連データを削除しました。',invalid:'リンクが無効か、有効期限が切れています。',error:'現在削除できません。後でもう一度お試しください。'},zh:{title:'最终确认删除账号',body:'点击下方按钮将永久删除账号和相关数据。',warning:'此操作无法撤销。',action:'永久删除账号',success:'账号和相关数据已删除。',invalid:'链接无效或已过期。',error:'目前无法删除，请稍后重试。'}};
const query=new URLSearchParams(location.search),lang=copy[query.get('lang')]?query.get('lang'):'ko',t=copy[lang];document.documentElement.lang=lang;for(const id of ['title','body','warning'])document.querySelector('#'+id).textContent=t[id];const button=document.querySelector('#delete'),status=document.querySelector('#status');button.textContent=t.action;const fragment=new URLSearchParams(location.hash.slice(1)),token=fragment.get('token')||'';history.replaceState(null,'',location.pathname+location.search);if(!/^[A-Za-z0-9_-]{43}$/.test(token)){button.disabled=true;status.textContent=t.invalid}button.addEventListener('click',async()=>{button.disabled=true;status.textContent='';try{const response=await fetch('/account-deletion/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,confirmation:'DELETE'})});if(response.ok)status.textContent=t.success;else{status.textContent=response.status===400?t.invalid:t.error;button.disabled=false}}catch{status.textContent=t.error;button.disabled=false}});
</script></body></html>
